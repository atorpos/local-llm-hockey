# Self-hosted search for the pipeline. Start:  docker compose up -d
# Test:  curl "http://localhost:8888/search?q=nhl&format=json" | head -c 300
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:8888:8080"        # only reachable from this Mac
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped

volumes:
  searxng-cache:
